<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="Justus.net — a small map of where to find me online." />
  <title>Justus.net</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="intro">
      <p class="kicker">justus.net</p>
      <h1>Justus</h1>
      <p class="subtitle">A small map of where to find me online.</p>
    </div>

    <section class="network" id="network" aria-label="Links to Justus around the internet">
      <canvas class="graph" id="graph" aria-hidden="true"></canvas>
      <div class="link-layer" id="link-layer"></div>
    </section>

    <p class="hint" id="hint" aria-live="polite">move through the network</p>
  </main>
</body>
</html>
